[package]
name = "yu-markdown"
description = "Lossless Markdown syntax experiments for Yu Editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
yu-core = { path = "../yu-core" }
yu-text = { path = "../yu-text" }
yu-syntax = { path = "../yu-syntax" }
yu-decoration = { path = "../yu-decoration" }
# 围栏代码块的着色。tree-sitter 关在那个 crate 里，这里看不见它。
yu-highlight = { path = "../yu-highlight" }
# Unicode 引用标签归一化：引用标签
# 的 Unicode full case folding（不变量 F3）。标准库只有 simple lowercase，
# `ẞ` 折成 `ß` 而不是 `ss`，于是 `[ẞ]` 匹配不上 `[SS]:`。
caseless = { workspace = true }
# Static named-reference data shared with the CommonMark test oracle.
entities = "1.0.1"

[lints]
workspace = true

name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      # fail-fast 关掉：矩阵存在的全部理由是「三个平台各说各的话」，而默认的
      # fail-fast 会在第一个红的时候取消其余两个——于是三平台矩阵退化成
      # 「最快红的那一个」。真实后果：ubuntu 因为一处 macOS-only 依赖被无条件
      # 引用而编译失败时，windows job 一步都没跑过，而 windows 正是这个矩阵
      # 唯一的存在理由（刀 d/e/f 的判据全在它身上）。修一层露一层，一次只能
      # 看见一层。
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          # llvm-tools 是为了 check-ffi-symbols.py：Windows runner 上没有
          # nm，llvm-nm 从 rustup 的 sysroot 里拿。
          components: rustfmt, clippy, llvm-tools
      - run: cargo fmt --all --check
      # 本地 tools/verify.sh 必须能跑到这里的每一条命令。删掉一个 crate 时
      # 曾经打断过一个 CI job 而本地全绿——本地门禁给了它无权给的绿灯。
      - run: python3 tools/check-ci-parity.py
      # cargo 只拦得住依赖环，拦不住方向：yu-font 依赖 yu-layout 在 cargo
      # 看来完全合法，而那正是不变量 E2 禁止的反向依赖。
      - run: python3 tools/check-deps.py
      # 头文件是手写的，与 Rust 实现之间没有编译期约束：删掉一个
      # extern "C" fn 不会让头文件报错，孤儿声明也不会让构建失败。
      - run: python3 tools/check-ffi-header.py
      # 上一条读源码，正则不认识 cfg。这一条读产物的符号表——两个整个挂在
      # cfg(target_os = "macos") 下的函数曾经让头文件在 Windows/Linux 上
      # 撒谎，而当时全套门禁是绿的：从来没有人在非 macOS 上*链接*过这个
      # staticlib，只*编译*过。三个平台的覆盖靠的就是上面这个矩阵。
      - run: python3 tools/check-ffi-symbols.py
      # 字节/字符索引混用不会 panic，只会在某个 emoji 上悄悄切错位置。
      # 不变量 E4 要求 ropey 留在 yu-text 里，这条边界只能靠检查守。
      - run: python3 tools/check-rope-leak.py
      # 散装的 x/y/width/height 四元组说不出自己是 block 局部坐标、文档坐标
      # 还是物理像素。混用不报错，只是画错——768b5e3 与 5fac1fe 都是这么来的。
      - run: python3 tools/check-geometry.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # 随机 fuzz 单独成 job：它是唯一一条**不确定**的检查，混进上面那组会让
  # 「本地绿 = CI 绿」这个前提失效。它找到的每个失败都要被最小化后写进
  # crates/yu-syntax/tests/corpus/，从此由确定性的 cargo test 永久看守。
  # 只跑一个平台：解析器没有平台相关行为，跑三份只是烧三倍时间。
  #
  # **跑 macOS 而不是 ubuntu**：`tools/fuzz.sh` 与仓库里其余 6 个脚本一样是
  # zsh（用了 `${0:A:h:h}` 这类 zsh 专有修饰符），而 ubuntu runner 上没有 zsh
  # ——这条 job 长期以 `exit 127` 红着，而本地 `verify.sh --fuzz` 一直是绿的。
  # 选平台等于选解释器：`tools/` 是开发机（macOS）的工具，让 CI 用同一个
  # 解释器跑，「本地绿 = CI 绿」这个前提才成立。
  #
  # `check-ci-parity.py` 守的是「CI 的每条命令都在 verify.sh 里出现」——
  # `tools/fuzz.sh 120` 这个字符串一直对得上，**它守不住那条命令在那个
  # runner 上能不能执行**。这是 parity 的盲区，记在这里。
  fuzz:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - run: tools/fuzz.sh 120

  # v1 时期产品壳与它的 self-check 从未进入 CI，因而没有反馈回路，
  # self-check 代码无节制地长到了 3800 行。v2 起它们必须每次提交都跑。
  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - run: platform/macos/yu-shell-macos/run-self-checks.sh --build


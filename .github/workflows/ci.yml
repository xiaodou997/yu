name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # cargo 只拦得住依赖环，拦不住方向：yu-font 依赖 yu-layout 在 cargo
      # 看来完全合法，而那正是不变量 E2 禁止的反向依赖。
      - run: python3 tools/check-deps.py
      # 头文件是手写的，与 Rust 实现之间没有编译期约束：删掉一个
      # extern "C" fn 不会让头文件报错，孤儿声明也不会让构建失败。
      - run: python3 tools/check-ffi-header.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # v1 时期产品壳与它的 self-check 从未进入 CI，因而没有反馈回路，
  # self-check 代码无节制地长到了 3800 行。v2 起它们必须每次提交都跑。
  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - run: platform/macos/yu-shell-macos/run-self-checks.sh --build


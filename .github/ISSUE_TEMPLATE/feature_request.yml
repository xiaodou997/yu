name: Feature request
description: Suggest an improvement or new capability for Yu.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first so related ideas can stay together.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or limitation behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you would like Yu to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Include related tools, examples, screenshots, or other context if useful.

name: Bug report
description: Report a reproducible problem in Yu.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Yu. Please search existing issues before filing a new one.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yu version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Edit…
        3. See…
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal Markdown sample
      description: If relevant, paste a small sample that reproduces the problem. Remove private or sensitive content first.
      render: markdown
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, logs, or other context if useful.

[package]
name = "yu-render-windows"
description = "Windows Direct3D 11 / DXGI renderer for Yu Editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
yu-assets = { path = "../../../crates/yu-assets" }
yu-core = { path = "../../../crates/yu-core" }
yu-font = { path = "../../../crates/yu-font" }
yu-render = { path = "../../../crates/yu-render" }
yu-scene = { path = "../../../crates/yu-scene" }
yu-workspace = { path = "../../../crates/yu-workspace" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-core = "0.58"

[lints]
workspace = true

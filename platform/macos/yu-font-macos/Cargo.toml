[package]
name = "yu-font-macos"
description = "macOS CoreText font catalog and fallback adapter for Yu Editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
unicode-segmentation = "1.13"
yu-core = { path = "../../../crates/yu-core" }
yu-font = { path = "../../../crates/yu-font" }
yu-projection = { path = "../../../crates/yu-projection" }

[dev-dependencies]
yu-layout = { path = "../../../crates/yu-layout" }
yu-text = { path = "../../../crates/yu-text" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFAttributedString",
    "CFDictionary",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGAffineTransform",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGFont",
    "CGGeometry",
    "CGImage",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std",
    "CTDefines",
    "CTFont",
    "CTFontDescriptor",
    "CTFontManager",
    "CTFontTraits",
    "CTLine",
    "CTRun",
    "CTStringAttributes",
    "objc2-core-graphics",
] }

[lints]
workspace = true

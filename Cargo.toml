[workspace]
resolver = "3"
members = [
    "crates/yu-core",
    "crates/yu-editor",
    "crates/yu-storage-ffi",
    "crates/yu-font",
    "crates/yu-text",
    "crates/yu-markdown",
    "crates/yu-syntax",
    "crates/yu-decoration",
    "crates/yu-state",
    "crates/yu-export",
    "crates/yu-layout",
    "crates/yu-scene",
    "crates/yu-render",
    "crates/yu-assets",
    "crates/yu-embedded-math",
    "crates/yu-highlight",
    "crates/yu-storage",
    "crates/yu-workspace",
    "platform/macos/yu-font-macos",
    "platform/macos/yu-render-macos",
    "tools/yu-bench",
    "tools/yu-inspect",
]

# 外部依赖里需要**两个 crate 用同一个版本**的那些放在这里。
#
# `caseless`：F3 的 full case folding。产品链路（`yu-markdown` 的引用表）与
# 参考渲染（`yu-syntax` 测试里的 `normalize_label`）必须折出同一个答案——
# 两处各写一个版本号，漂开之后表现是「棘轮绿着而编辑器里那条引用不成立」，
# 不报错。comrak 自己用的也是它（`comrak::strings::normalize_label`）。
[workspace.dependencies]
caseless = "0.2.2"
# `comrak`：S7 第六刀之后它**同时**是产品实现（`yu-export` 的 HTML 导出）与
# 测试 oracle（`yu-syntax` 的 CommonMark 差分）。两处漂到不同版本的话，
# 「差分绿了」与「导出对了」就不再是同一个 comrak 说的话。
comrak = { version = "0.54", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Yu Editor contributors"]
repository = "https://github.com/xiaodou997/yu"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
